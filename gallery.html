    <style>
        /* Gallery page hero banner */
        .gallery-hero {
            background-color: var(--primary);
            padding: 9rem 0 4rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .gallery-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at top, rgba(255,209,0,0.08) 0%, transparent 65%);
        }

        .gallery-hero h1 {
            color: var(--text-light);
            font-size: 3.5rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .gallery-hero p {
            color: rgba(255,255,255,0.65);
            font-size: 1.15rem;
            max-width: 560px;
            margin: 0 auto;
            position: relative;
        }

        /* Standalone gallery page layout */
        .gallery-page {
            background-color: var(--primary);
            padding: 3rem 0 6rem;
        }

        /* Larger grid for dedicated page */
        .gallery-page .gallery-grid {
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 260px;
        }

        @media (max-width: 1024px) {
            .gallery-page .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-auto-rows: 220px;
            }
        }

        @media (max-width: 700px) {
            .gallery-page .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 170px;
            }
            .gallery-hero h1 { font-size: 2.2rem; }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--accent); }
    </style>
</head>
